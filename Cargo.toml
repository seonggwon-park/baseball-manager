[workspace]
resolver = "2"
members = ["crates/bm-physics", "crates/bm-engine", "crates/bm-world", "crates/bm-session", "crates/bm-cli"]
# The desktop shell has its own lock file and is built separately (see app/src-tauri).
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.82"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2
