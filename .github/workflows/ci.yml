name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: fmt, clippy, tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the stable toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Smoke-test the CLI
        run: |
          cargo run --release --bin bm -- game --seed 7
          cargo run --release --bin bm -- validate --games 500 --seed 1
          cargo run --release --bin bm -- we --games 300 --json "$RUNNER_TEMP/we.json"

  python:
    name: Python environment (bm_gym)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the stable toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format and clippy (binding)
        run: |
          cargo fmt --manifest-path crates/bm-py/Cargo.toml -- --check
          cargo clippy --manifest-path crates/bm-py/Cargo.toml -- -D warnings
      - name: Build and install
        run: pip install "./python[test]"
      - name: Tests
        run: pytest -q python/tests

  interface:
    name: interface type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Type-check and build
        working-directory: app
        run: npm run build

  windows:
    name: build and tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the stable toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Build
        run: cargo build --workspace --release
      - name: Tests
        run: cargo test --workspace
      - name: Smoke-test the CLI
        run: cargo run --release --bin bm -- game --seed 7
