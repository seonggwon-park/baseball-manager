name: Windows app

# Builds the desktop installers. Download them from the run's "Artifacts".
on:
  pull_request:
    paths:
      - "app/**"
      - "crates/**"
      - "data/**"
      - ".github/workflows/windows-app.yml"
  workflow_dispatch:

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the stable Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install interface dependencies
        working-directory: app
        run: npm ci
      - name: Build the installers
        working-directory: app
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: baseball-manager-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
