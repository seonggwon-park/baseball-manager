[package]
name = "bm-py"
description = "Python binding of bm-gym (the module bm_gym._core), built with maturin from python/"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.82"

# Built on its own (python/pyproject.toml), outside the workspace, so that the workspace
# builds and tests without a Python toolchain.
[workspace]

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
bm-gym = { path = "../bm-gym" }
bm-engine = { path = "../bm-engine" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
